name: DON Creator ranker

on:
  schedule:
    - cron: '17 6 * * *'   # every day at 06:17 UTC
  workflow_dispatch:
    inputs:
      command:
        description: 'What to run'
        type: choice
        options: [daily, approve, veto, unveto, clear, propose, payout, payout-retry, status]
        default: daily
      period:
        description: 'Period number (1–8) for approve / veto / unveto / clear / propose / payout-retry'
        required: false
      user:
        description: 'X username for veto / unveto / clear (without @)'
        required: false
      rank:
        description: 'Rank (1–5) for payout-retry'
        required: false

permissions:
  contents: write

concurrency:
  group: creator-ranker
  cancel-in-progress: false

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: creator/package-lock.json

      - name: Install
        run: npm ci --omit=dev --no-audit --no-fund
        working-directory: creator

      - name: Run ranker
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          PAYOUT_KEYPAIR: ${{ secrets.PAYOUT_KEYPAIR }}
          PAYOUT_RPC: ${{ secrets.PAYOUT_RPC }}
          CMD: ${{ inputs.command || 'daily' }}
          PERIOD: ${{ inputs.period }}
          XUSER: ${{ inputs.user }}
          RANK: ${{ inputs.rank }}
        run: |
          args=("$CMD")
          [ -n "$PERIOD" ] && args+=(--period "$PERIOD")
          [ -n "$XUSER" ] && args+=(--user "$XUSER")
          [ -n "$RANK" ] && args+=(--rank "$RANK")
          set -o pipefail
          node creator/src/cli.js "${args[@]}" 2>&1 | sed '/bigint: Failed to load bindings/d' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        if: always()
        env:
          CMD: ${{ inputs.command || 'daily' }}
        run: |
          git config user.name "don-creator-ranker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add creator/data creator/results creator/payouts 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Creator ranker: $CMD $(date -u +%F)"
          git push
